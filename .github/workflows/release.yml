name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo files
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          TAG_VERSION="$(printf '%s' "$RELEASE_TAG" | sed 's/^v//')"
          PACKAGE_VERSION="$(grep -m1 '^version =' Cargo.toml | cut -d '"' -f2)"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux binary
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          mkdir -p dist/staging
          cp "target/${{ matrix.target }}/release/taskflowtui" dist/staging/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/staging/
          ARCHIVE="taskflowtui-$RELEASE_TAG-${{ matrix.target }}.tar.gz"
          tar -czf "dist/$ARCHIVE" -C dist/staging .
          sha256sum "dist/$ARCHIVE" > "dist/$ARCHIVE.sha256"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/taskflowtui.exe" dist/staging/
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE dist/staging/
          $archive = "taskflowtui-$env:RELEASE_TAG-${{ matrix.target }}.zip"
          Compress-Archive -Path dist/staging/* -DestinationPath "dist/$archive"
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "dist/$archive.sha256"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  linux-packages:
    name: Build Debian and RPM packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Cargo files
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          TAG_VERSION="$(printf '%s' "$RELEASE_TAG" | sed 's/^v//')"
          PACKAGE_VERSION="$(grep -m1 '^version =' Cargo.toml | cut -d '"' -f2)"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Install Linux packaging tools
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      - name: Build Debian package
        run: |
          cargo deb --no-build
          mkdir -p dist
          cp target/debian/*.deb dist/

      - name: Build RPM package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cargo generate-rpm -o "dist/taskflowtui-$RELEASE_TAG.x86_64.rpm"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.deb *.rpm > SHA256SUMS

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build, linux-packages]
    runs-on: ubuntu-latest
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
