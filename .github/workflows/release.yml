name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo files
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match Cargo.toml version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/staging
          cp "target/${{ matrix.target }}/release/taskflowtui" dist/staging/
          cp README.md dist/staging/
          ARCHIVE="taskflowtui-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar -czf "dist/$ARCHIVE" -C dist/staging .
          sha256sum "dist/$ARCHIVE" > "dist/$ARCHIVE.sha256"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/taskflowtui.exe" dist/staging/
          Copy-Item README.md dist/staging/
          $archive = "taskflowtui-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip"
          Compress-Archive -Path dist/staging/* -DestinationPath "dist/$archive"
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "dist/$archive.sha256"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
